# GrowBuddy 2 server config. Copy to /etc/growbuddy/config.toml on the Pi
# (or ./config.toml for local dev). Any key can be overridden with an env var:
# GROWBUDDY_<SECTION>__<KEY>, e.g. GROWBUDDY_CAMERA__INTERVAL_S=600
# Runtime-editable alert settings live in the DB (PUT /api/v1/alert-settings);
# the [alerts] values below are only their initial defaults.

[server]
host = "0.0.0.0"
port = 8000
api_token = "change-me"            # python -c "import secrets; print(secrets.token_urlsafe(32))"
data_dir = "/var/lib/growbuddy"    # growbuddy.db, snapshots/, photos/, backups/

[ble]
enabled = true
simulate = false                   # dev: two fake sensors (tent + drying) instead of BlueZ
# Sensors are discovered and adopted from the app (stored in the DB), not configured here.
discovery_ttl_s = 300              # how long an unadopted device stays in the discovered list
watchdog_s = 300                   # restart the scanner if adopted sensors go silent this long

[camera]
enabled = true
simulate = false                   # dev: generated frames instead of a webcam
device = "/dev/video0"             # prefer /dev/v4l/by-id/...
width = 1920
height = 1080
stream_fps = 10
interval_s = 3600                  # timelapse: one stored frame per hour, on the hour
jpeg_quality = 88                  # used when re-encoding (no MJPEG passthrough) and thumbnails
warmup_frames = 5                  # discarded after opening (dark/stale first frames)
thumb_edge_px = 400
idle_close_s = 10                  # release the device this long after the last viewer
max_viewers = 4                    # simultaneous live streams

[photos]
max_edge_px = 2560                 # phone uploads are downscaled to this
thumb_edge_px = 400
jpeg_quality = 88

[alerts]
evaluate_every_s = 60
debounce_s = 600                   # critical / back to normal must persist this long before alerting
warning_debounce_s = 1800          # a new warning must persist this long (30 min)
repeat_after_s = 7200              # re-notify an unchanged active alert after this
offline_after_s = 300              # sensor silent this long -> sensor_offline
battery_low_pct = 15
notify_warning = true              # push warnings / criticals / "back to normal" via ntfy
notify_critical = true
notify_resolved = true
language = "en"                    # notification texts: en, da (src/growbuddy/locales/); also set from the app

[ntfy]
enabled = true
url = "http://127.0.0.1:2586"
topic = "growbuddy"
token = "tk_change-me"             # ntfy write token for user 'growbuddy'
click_url = "growbuddy://alerts"   # deep link opened when tapping the notification
public_url = "http://growbuddy:2586"  # ntfy as phones reach it (install.sh sets the host); app push endpoints must be on it
environment_push_s = 300           # notification widget: environment snapshot every 5 min (and on alert changes)

[retention]
readings_days = 90                 # raw readings; hourly rollups are kept forever
snapshots_days = 365               # timelapse images on the Pi (the laptop backup keeps all)
events_days = 180
run_time = "02:30"                 # local time; unused photos older than 7 days are removed too

[backup]
snapshot_time = "03:00"            # local time for the nightly VACUUM INTO
keep_local = 7                     # nightly DB copies kept on the Pi
